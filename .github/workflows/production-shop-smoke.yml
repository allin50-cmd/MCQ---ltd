name: production-shop-smoke
on:
  push:
    branches: [main]
    paths:
      - "public/shop.html"
      - "public/shop-products.js"
      - "public/djs-ditching-laptops.html"
      - "public/magazine.html"
      - "public/index.html"
      - "public/site-shell.js"
      - "public/site-shell.css"
      - "public/crm.html"
      - "test/crm-ui.test.js"
      - "public/mcq-splash-production.webp"
      - "public/swap.html"
      - "test/splash-screen.test.js"
      - "src/market.js"
      - "data/market-research-100.csv"
      - "data/product-image-audit-100.csv"
      - "src/server.js"
      - "scripts/production-shop-smoke.mjs"
      - ".github/workflows/production-shop-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wait for production and verify real shop catalogue
        env:
          MCQ_BASE_URL: https://mcq-audio.onrender.com
          MCQ_SMOKE_ATTEMPTS: "8"
          MCQ_SMOKE_DELAY_MS: "5000"
          MCQ_EXPECTED_COMMIT: ${{ github.sha }}
        run: node scripts/production-shop-smoke.mjs
