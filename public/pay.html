<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MCQ Secure Deposit</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f5f3;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:520px;margin:0 auto;min-height:100dvh;padding:56px 22px;display:flex;align-items:center}.card{width:100%;background:#fff;border:1px solid #e8e8e3;border-radius:26px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.08)}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#666}h1{font-size:34px;line-height:1;margin:14px 0 12px;letter-spacing:-.04em}p{font-size:16px;line-height:1.55;color:#555}button{width:100%;margin-top:22px;border:0;border-radius:16px;background:#111;color:white;padding:16px;font-weight:800;font-size:16px;cursor:pointer}button:disabled{opacity:.45}.msg{margin-top:14px;font-size:14px;color:#a52222}.ok{color:#087a3e}</style></head><body><main><section class="card"><div class="eyebrow">MCQ Entertainments Ltd</div><h1>Secure your booking</h1><p>Your deposit is recorded only after the payment provider confirms it as paid.</p><button id="pay">Pay deposit securely</button><div id="message" class="msg"></div></section></main><script>const params=new URLSearchParams(location.search);const quoteId=params.get("quote_id")||"";const status=params.get("status")||"";const btn=document.getElementById("pay"),msg=document.getElementById("message");if(status==="success"){msg.className="msg ok";msg.textContent="Payment received by the provider. MCQ is confirming your booking.";btn.style.display="none"}if(status==="cancelled"){msg.textContent="Payment was cancelled. Your booking has not been confirmed."}if(!quoteId&&!status){msg.textContent="Quote reference is missing.";btn.disabled=true}btn.addEventListener("click",async()=>{btn.disabled=true;btn.textContent="Opening secure checkout…";msg.textContent="";try{const r=await fetch("/api/payments/checkout",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({quote_id:quoteId})});const data=await r.json();if(!r.ok)throw new Error(data.error||"Unable to start checkout");location.assign(data.checkout_url)}catch(e){msg.textContent=e.message||"Unable to start checkout";btn.disabled=false;btn.textContent="Pay deposit securely"}});</script></body></html>
